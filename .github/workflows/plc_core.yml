name: plc_core

on:
  push:
    paths: ['packages/plc_core/**', '.github/workflows/plc_core.yml']
  pull_request:
    paths: ['packages/plc_core/**', '.github/workflows/plc_core.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plc_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
